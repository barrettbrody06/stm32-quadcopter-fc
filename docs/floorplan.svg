<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 z" fill="#8a8f98"/>
  </marker>
</defs>
<rect width="920" height="760" fill="#12141a"/>
<text x="36" y="44" fill="#e8eaed" font-size="21" font-weight="600">fc-board Rev A — placement floorplan</text>
<text x="36" y="68" fill="#8a8f98" font-size="13.5">50 × 50 mm, 4 layer, 30.5 × 30.5 mm M3 pattern · all parts top side (single-sided assembly)</text>

<!-- board -->
<rect x="80" y="100" width="600" height="600" rx="10" fill="#1b1f28" stroke="#3d4450" stroke-width="2"/>

<!-- mounting holes at +/-15.25 mm  -> 380 +/- 183 -->
<g fill="none" stroke="#6b7280" stroke-width="2">
  <circle cx="197" cy="217" r="19"/><circle cx="563" cy="217" r="19"/>
  <circle cx="197" cy="583" r="19"/><circle cx="563" cy="583" r="19"/>
</g>
<line x1="197" y1="217" x2="563" y2="217" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="197" y1="583" x2="563" y2="583" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="197" y1="217" x2="197" y2="583" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="563" y1="217" x2="563" y2="583" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="380" y="207" fill="#6b7280" font-size="11" text-anchor="middle">30.5 mm</text>

<!-- POWER zone: top strip -->
<rect x="92" y="112" width="576" height="150" rx="7" fill="#3a2318" stroke="#c2703c" stroke-width="1.6"/>
<text x="104" y="132" fill="#e9a06a" font-size="13" font-weight="600">POWER — noisy zone</text>
<g font-size="11.5">
  <rect x="104" y="146" width="66" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="137" y="166" fill="#f5e0d0" text-anchor="middle">J1</text><text x="137" y="182" fill="#c9a894" text-anchor="middle" font-size="10">batt in</text>
  <rect x="178" y="146" width="52" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="204" y="166" fill="#f5e0d0" text-anchor="middle">D4</text><text x="204" y="182" fill="#c9a894" text-anchor="middle" font-size="10">TVS</text>
  <rect x="238" y="146" width="58" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="267" y="166" fill="#f5e0d0" text-anchor="middle">C1 C2</text><text x="267" y="182" fill="#c9a894" text-anchor="middle" font-size="10">+C10</text>
  <rect x="304" y="146" width="62" height="46" rx="4" fill="#7a3f1c" stroke="#e08a4a" stroke-width="2"/><text x="335" y="166" fill="#fff1e4" text-anchor="middle" font-weight="600">U1</text><text x="335" y="182" fill="#e8bfa2" text-anchor="middle" font-size="10">buck</text>
  <rect x="374" y="146" width="46" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="397" y="166" fill="#f5e0d0" text-anchor="middle">D1</text>
  <rect x="428" y="146" width="52" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="454" y="166" fill="#f5e0d0" text-anchor="middle">L1</text>
  <rect x="488" y="146" width="62" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="519" y="166" fill="#f5e0d0" text-anchor="middle">C3-C5</text>
  <rect x="558" y="146" width="52" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="584" y="166" fill="#f5e0d0" text-anchor="middle">U2</text><text x="584" y="182" fill="#c9a894" text-anchor="middle" font-size="10">LDO</text>
  <rect x="618" y="146" width="42" height="46" rx="4" fill="#54311f" stroke="#c2703c"/><text x="639" y="170" fill="#f5e0d0" text-anchor="middle">C11-13</text>
</g>
<rect x="238" y="140" width="182" height="58" rx="6" fill="none" stroke="#ff6b4a" stroke-width="2.5" stroke-dasharray="6 3"/>
<text x="329" y="214" fill="#ff8a6a" font-size="11.5" text-anchor="middle" font-weight="600">keep this loop tiny — C10 across U1 pin 2→7, D1 at pin 8→7</text>

<!-- MCU zone -->
<rect x="252" y="300" width="230" height="160" rx="7" fill="#16303a" stroke="#3f8fa8" stroke-width="1.6"/>
<text x="264" y="320" fill="#7fc6dd" font-size="13" font-weight="600">MCU</text>
<rect x="300" y="330" width="118" height="108" rx="5" fill="#1e4a5c" stroke="#5fb3cd" stroke-width="2"/>
<text x="359" y="378" fill="#e6f6fb" font-size="14" text-anchor="middle" font-weight="600">U3</text>
<text x="359" y="396" fill="#9fd4e5" font-size="10.5" text-anchor="middle">F411 7×7</text>
<rect x="262" y="330" width="32" height="52" rx="4" fill="#1e4a5c" stroke="#5fb3cd"/>
<text x="278" y="352" fill="#e6f6fb" font-size="11" text-anchor="middle">Y1</text>
<text x="278" y="368" fill="#9fd4e5" font-size="9" text-anchor="middle">C29/30</text>
<rect x="424" y="330" width="50" height="30" rx="4" fill="#1e4a5c" stroke="#5fb3cd"/>
<text x="449" y="350" fill="#e6f6fb" font-size="10" text-anchor="middle">C20-24</text>

<!-- IMU zone -->
<rect x="288" y="500" width="184" height="118" rx="7" fill="#182f22" stroke="#4a9e6b" stroke-width="1.6"/>
<text x="300" y="520" fill="#7fd6a0" font-size="13" font-weight="600">IMU — quiet zone</text>
<rect x="344" y="532" width="72" height="60" rx="5" fill="#1f4a32" stroke="#63c78c" stroke-width="2"/>
<text x="380" y="558" fill="#e4f7ec" font-size="13" text-anchor="middle" font-weight="600">U4</text>
<text x="380" y="576" fill="#a3ddbb" font-size="10" text-anchor="middle">ICM-42605</text>
<line x1="380" y1="400" x2="380" y2="500" stroke="#4a9e6b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="392" y="480" fill="#7fd6a0" font-size="11">12 mm below rotation centre</text>

<!-- distance callout -->
<line x1="454" y1="196" x2="392" y2="530" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="470" y="330" fill="#a8aeb8" font-size="11.5">28 mm L1 → U4</text>
<text x="470" y="348" fill="#6f757f" font-size="10.5">max separation the board allows</text>

<!-- connectors -->
<g font-size="11">
  <rect x="86" y="400" width="34" height="76" rx="4" fill="#2b2b3d" stroke="#7b7ba8"/><text x="103" y="432" fill="#d6d6ee" text-anchor="middle">USB</text><text x="103" y="448" fill="#a0a0c4" text-anchor="middle" font-size="9">C</text>
  <rect x="640" y="330" width="34" height="60" rx="4" fill="#2b2b3d" stroke="#7b7ba8"/><text x="657" y="356" fill="#d6d6ee" text-anchor="middle">J5</text><text x="657" y="372" fill="#a0a0c4" text-anchor="middle" font-size="9">RX</text>
  <rect x="640" y="400" width="34" height="60" rx="4" fill="#2b2b3d" stroke="#7b7ba8"/><text x="657" y="426" fill="#d6d6ee" text-anchor="middle">J2</text><text x="657" y="442" fill="#a0a0c4" text-anchor="middle" font-size="9">SWD</text>
  <rect x="640" y="470" width="34" height="44" rx="4" fill="#2b2b3d" stroke="#7b7ba8"/><text x="657" y="496" fill="#d6d6ee" text-anchor="middle">J3</text>
  <rect x="490" y="640" width="90" height="34" rx="4" fill="#2b2b3d" stroke="#7b7ba8"/><text x="535" y="662" fill="#d6d6ee" text-anchor="middle">J4  ESC</text>
</g>
<path d="M120 438 L300 400" stroke="#7b7ba8" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="150" y="412" fill="#9a9ac2" font-size="10.5">D+/D− pair</text>

<!-- stackup -->
<text x="712" y="132" fill="#e8eaed" font-size="14" font-weight="600">Stackup</text>
<g font-size="11">
  <rect x="712" y="146" width="170" height="24" fill="#8a6a3a"/><text x="720" y="162" fill="#fff">L1  signal + parts</text>
  <rect x="712" y="172" width="170" height="9" fill="#2a2f38"/><text x="888" y="180" fill="#6f757f" font-size="9" text-anchor="end"></text>
  <rect x="712" y="183" width="170" height="24" fill="#3f6b4f"/><text x="720" y="199" fill="#fff">L2  solid GND</text>
  <rect x="712" y="209" width="170" height="34" fill="#2a2f38"/>
  <rect x="712" y="245" width="170" height="24" fill="#5b4570"/><text x="720" y="261" fill="#fff">L3  power pours</text>
  <rect x="712" y="271" width="170" height="9" fill="#2a2f38"/>
  <rect x="712" y="282" width="170" height="24" fill="#8a6a3a"/><text x="720" y="298" fill="#fff">L4  slow sig + GND</text>
</g>
<text x="712" y="326" fill="#8a8f98" font-size="10.5">L1→L2  0.210 mm prepreg</text>
<text x="712" y="342" fill="#8a8f98" font-size="10.5">L2→L3  1.065 mm core</text>
<text x="712" y="360" fill="#e9a06a" font-size="10.5">5× closer — put every</text>
<text x="712" y="375" fill="#e9a06a" font-size="10.5">critical net on L1</text>

<text x="712" y="412" fill="#e8eaed" font-size="14" font-weight="600">Route order</text>
<g font-size="11" fill="#b8bec8">
  <text x="712" y="434">1 · buck power loop</text>
  <text x="712" y="452">2 · crystal + load caps</text>
  <text x="712" y="470">3 · VCAP1, VDD 100nF</text>
  <text x="712" y="488">4 · IMU decoupling</text>
  <text x="712" y="506">5 · USB D+/D− pair</text>
  <text x="712" y="524">6 · SPI to IMU</text>
  <text x="712" y="542">7 · motor / UART</text>
  <text x="712" y="560">8 · pours, DRC, 3D</text>
</g>
<text x="712" y="596" fill="#e8eaed" font-size="14" font-weight="600">Rules</text>
<g font-size="11" fill="#b8bec8">
  <text x="712" y="618">trace / space  0.15 mm</text>
  <text x="712" y="636">via  0.3 drill / 0.6 pad</text>
  <text x="712" y="654">power traces  0.4 mm</text>
  <text x="712" y="672">U3 pad  9× GND vias</text>
</g>
<text x="80" y="726" fill="#6f757f" font-size="11">Never route under the SW node (U1 pin 8 → L1) · L2 stays unbroken beneath it · no plane splits anywhere</text>
</svg>
